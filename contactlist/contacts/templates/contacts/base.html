{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Contact List{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'contacts/style.css' %}" />
  </head>
  <body>
    <header>
      <a class="brand" href="{% url 'contacts:home' %}">📇 List de Contatos</a>
      <nav>
        <a href="{% url 'contacts:add' %}">+ Adicionar</a>
        <a href="{% url 'contacts:search' %}">Pesquisar</a>
        <a href="{% url 'contacts:pick_edit' %}">Editar</a>
        <a href="{% url 'contacts:pick_remove' %}">Remover</a>
      </nav>
    </header>
    <main>
      {% if messages %}
      <ul class="messages">
        {% for message in messages %}
        <li class="msg {{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %} {% block content %}{% endblock %}
    </main>
  </body>
</html>
