{% extends "contacts/base.html" %} {% block content %}
<h1>Pesquisar contato</h1>
<form method="get" class="card inline">
  <select name="by">
    <option value="name" {% if by == "name" %}selected{% endif %}>Nome</option>
    <option value="phone" {% if by == "phone" %}selected{% endif %}>
      Telefone
    </option>
  </select>
  <input
    type="text"
    name="q"
    value="{{ q }}"
    placeholder="Escreva uma parte do número"
    autofocus
  />
  <button class="btn primary" type="submit">Pesquisar</button>
</form>

{% if results is not None %} {% if results %}
<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>Telefone</th>
      <th>E-mail</th>
    </tr>
  </thead>
  <tbody>
    {% for c in results %}
    <tr>
      <td>{{ c.name }}</td>
      <td>{{ c.phone }}</td>
      <td>{{ c.email }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="muted">Contato não encontrado.</p>
{% endif %} {% endif %} {% endblock %}
